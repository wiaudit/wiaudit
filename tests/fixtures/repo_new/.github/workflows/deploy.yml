name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: 22222222-2222-2222-2222-222222222222
          tenant-id: 00000000-0000-0000-0000-000000000000
          subscription-id: 33333333-3333-3333-3333-333333333333
