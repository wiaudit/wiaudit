[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiaudit"
version = "0.1.4"
description = "Workload Identity Auditor: finds risky OIDC trust between GitHub Actions and Azure, and explains why a workflow cannot get a token."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["PyYAML>=6.0"]
keywords = ["azure", "entra", "github-actions", "oidc", "workload-identity", "security", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Topic :: Security",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/wiaudit/wiaudit"
Issues = "https://github.com/wiaudit/wiaudit/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
wiaudit = "wiaudit.cli:main"
wiaudit-mcp = "wiaudit.mcp_server:main"

[tool.setuptools.packages.find]
include = ["wiaudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
